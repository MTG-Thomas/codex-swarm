name: sonar

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  # Minimal permissions: SonarCloud only needs source and pull request metadata.
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: |
          mkdir -p .sonar
          go test -coverprofile=.sonar/coverage.out ./...

      - name: Check SonarCloud configuration
        id: sonar
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan
        if: github.event_name == 'push' && steps.sonar.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud not configured
        if: github.event_name == 'push' && steps.sonar.outputs.configured != 'true'
        run: |
          echo "Skipping SonarCloud scan because SONAR_TOKEN is not configured for this repository."
          echo "Create the SonarCloud project MTG-Thomas_codex-swarm in organization mtg-thomas and add SONAR_TOKEN as a GitHub Actions secret."
